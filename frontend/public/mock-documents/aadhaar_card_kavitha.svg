<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 540" width="850" height="540">
  <defs>
    <style>
      .aadhaar-title { font-family: 'Arial', sans-serif; font-weight: bold; fill: #1e293b; }
      .tamil { font-family: 'Arial Unicode MS', 'Plus Jakarta Sans', sans-serif; font-weight: bold; fill: #1e293b; }
      .label { font-family: 'Arial', sans-serif; font-size: 11px; fill: #64748b; font-weight: bold; }
      .val { font-family: 'Arial', sans-serif; font-size: 13.5px; fill: #0f172a; font-weight: bold; }
      .watermark { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: 900; fill: rgba(220, 38, 38, 0.14); text-anchor: middle; letter-spacing: 3px; }
      .aadhaar-num { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: 900; fill: #b91c1c; letter-spacing: 5px; }
    </style>
  </defs>

  <rect width="850" height="540" fill="#f8fafc"/>
  
  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="820" height="510" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="22" y="22" width="806" height="496" rx="12" fill="#fffdfa" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Watermark -->
  <g transform="translate(425, 270) rotate(-22)">
    <text y="-80" class="watermark">★ MOCK CITIZEN IDENTITY CARD ★</text>
    <text y="-40" class="watermark">PROTOTYPE DEMONSTRATION ONLY</text>
    <text y="10" class="watermark" font-size="28" fill="rgba(220, 38, 38, 0.18)">NOT A GENUINE GOVERNMENT AADHAAR</text>
    <text y="60" class="watermark">FOR AUDIT SIMULATION ONLY</text>
  </g>

  <!-- Top Tricolor Ribbon -->
  <rect x="22" y="22" width="806" height="7" fill="#f97316"/>
  <rect x="22" y="29" width="806" height="7" fill="#ffffff"/>
  <rect x="22" y="36" width="806" height="7" fill="#16a34a"/>

  <!-- Header Header -->
  <g transform="translate(40, 55)">
    <!-- Ashok Pillar / Emblem Simulation -->
    <circle cx="28" cy="28" r="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 28 14 L 33 26 L 23 26 Z M 22 28 L 34 28 L 31 40 L 25 40 Z" fill="#1e3a8a"/>

    <text x="70" y="24" class="tamil" font-size="14">இந்திய தனித்துவ அடையாள ஆணையம்</text>
    <text x="70" y="44" class="aadhaar-title" font-size="16">Unique Identification Authority of India</text>
    <text x="70" y="60" font-family="'Arial', sans-serif" font-size="10.5" fill="#64748b">Government of India • e-Aadhaar Record (Sample)</text>
  </g>

  <!-- Right Hologram/Emblem Simulator -->
  <g transform="translate(730, 80)">
    <circle cx="0" cy="0" r="26" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="2,2"/>
    <text y="4" font-family="'Arial', sans-serif" font-size="7" font-weight="900" fill="#78350f" text-anchor="middle">GOVT OF INDIA</text>
  </g>

  <line x1="40" y1="125" x2="810" y2="125" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Card Body -->
  <g transform="translate(40, 145)">
    <!-- Photo Box -->
    <rect x="0" y="0" width="130" height="160" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="65" cy="55" r="32" fill="#94a3b8"/>
    <path d="M 25 150 C 25 105, 105 105, 105 150 Z" fill="#64748b"/>
    <rect x="15" y="168" width="100" height="18" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="65" y="181" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#1e40af" text-anchor="middle">CITIZEN PHOTO</text>

    <!-- Details Column -->
    <g transform="translate(155, 10)">
      <text x="0" y="15" class="label">NAME / பெயர்:</text>
      <text x="0" y="36" class="val" font-size="17" fill="#0f172a">Kavitha R (கவிதா ரா)</text>

      <text x="0" y="70" class="label">DATE OF BIRTH / பிறந்த தேதி:</text>
      <text x="0" y="88" class="val">14/08/2004</text>

      <text x="210" y="70" class="label">GENDER / பாலினம்:</text>
      <text x="210" y="88" class="val">FEMALE / பெண்</text>

      <text x="0" y="120" class="label">RESIDENTIAL ADDRESS / முகவரி:</text>
      <text x="0" y="138" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#334155">No. 14, Kamarajar Street, Anuppanadi,</text>
      <text x="0" y="154" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#334155">Madurai, Tamil Nadu – 625009</text>
    </g>

    <!-- QR Code Block -->
    <g transform="translate(620, 10)">
      <rect x="0" y="0" width="140" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="12" y="12" width="116" height="116" fill="#0f172a"/>
      <rect x="25" y="25" width="30" height="30" fill="#ffffff"/>
      <rect x="30" y="30" width="20" height="20" fill="#0f172a"/>
      <rect x="85" y="25" width="30" height="30" fill="#ffffff"/>
      <rect x="90" y="30" width="20" height="20" fill="#0f172a"/>
      <rect x="25" y="85" width="30" height="30" fill="#ffffff"/>
      <rect x="30" y="90" width="20" height="20" fill="#0f172a"/>
      <text x="70" y="160" font-family="'Arial', sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Secure Digital QR</text>
    </g>
  </g>

  <!-- Big Red Aadhaar Number Bar -->
  <g transform="translate(40, 375)">
    <rect width="770" height="52" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
    <text x="385" y="35" class="aadhaar-num" text-anchor="middle">XXXX  XXXX  8921</text>
    <text x="385" y="49" font-family="'Arial', sans-serif" font-size="8.5" fill="#dc2626" text-anchor="middle">FICTIONAL MASKED NUMBER (FOR DEMO PURPOSE ONLY)</text>
  </g>

  <!-- Bottom Tricolor Strip -->
  <rect x="22" y="440" width="806" height="5" fill="#f97316"/>
  <rect x="22" y="445" width="806" height="5" fill="#ffffff"/>
  <rect x="22" y="450" width="806" height="5" fill="#16a34a"/>

  <!-- Disclaimer Footer -->
  <g transform="translate(40, 465)">
    <rect width="770" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="385" y="18" font-family="'Arial', sans-serif" font-size="10.5" font-weight="900" fill="#991b1b" text-anchor="middle">
      PROTOTYPE MOCK DOCUMENT — NOT A REAL AADHAAR CARD
    </text>
    <text x="385" y="33" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      Contains fictional data generated exclusively for TN WelfarePath system prototype testing and officer audit demo.
    </text>
  </g>
</svg>
