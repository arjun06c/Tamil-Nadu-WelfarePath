<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130">
  <defs>
    <style>
      .school-title { font-family: 'Times New Roman', serif; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .tamil { font-family: 'Arial Unicode MS', 'Plus Jakarta Sans', sans-serif; font-weight: bold; fill: #1e3a8a; text-anchor: middle; }
      .label { font-family: 'Arial', sans-serif; font-size: 13px; fill: #334155; font-weight: bold; }
      .val { font-family: 'Arial', sans-serif; font-size: 14px; fill: #0f172a; font-weight: bold; }
      .watermark { font-family: 'Arial', sans-serif; font-size: 26px; font-weight: 900; fill: rgba(220, 38, 38, 0.13); text-anchor: middle; letter-spacing: 4px; }
      .body-txt { font-family: 'Georgia', serif; font-size: 15px; fill: #1e293b; line-height: 1.8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1130" fill="#fafaf9"/>

  <!-- Border -->
  <rect x="25" y="25" width="750" height="1080" fill="none" stroke="#1e3a8a" stroke-width="3"/>
  <rect x="32" y="32" width="736" height="1066" fill="none" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="36" y="36" width="728" height="1058" fill="none" stroke="#1e3a8a" stroke-width="0.6"/>

  <!-- Watermark -->
  <g transform="translate(400, 560) rotate(-40)">
    <text y="-180" class="watermark">★ MOCK CITIZEN DOCUMENT ★</text>
    <text y="-140" class="watermark">PROTOTYPE DEMONSTRATION ONLY</text>
    <text y="0" class="watermark" font-size="34" fill="rgba(220, 38, 38, 0.16)">NOT VALID FOR OFFICIAL USE</text>
    <text y="140" class="watermark">TN WELFAREPATH VERIFICATION WORKSPACE</text>
    <text y="180" class="watermark">★ FOR AUDIT SIMULATION ONLY ★</text>
  </g>

  <!-- Header -->
  <g transform="translate(400, 75)">
    <!-- School Education Emblem -->
    <circle cx="0" cy="0" r="32" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
    <path d="M -16 10 L 0 -12 L 16 10 L 0 4 Z" fill="#1e3a8a"/>
    <path d="M -12 14 L 12 14 L 10 18 L -10 18 Z" fill="#d97706"/>
    <text y="2" font-family="'Arial', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">TN SED</text>
  </g>

  <text x="400" y="130" class="tamil" font-size="18">தமிழ்நாடு அரசு • பள்ளிக் கல்வித் துறை</text>
  <text x="400" y="154" class="school-title" font-size="16" letter-spacing="1">GOVERNMENT OF TAMIL NADU</text>
  <text x="400" y="176" font-family="'Times New Roman', serif" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">GOVERNMENT GIRLS HIGHER SECONDARY SCHOOL</text>
  <text x="400" y="196" font-family="'Arial', sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="bold">
    OTHAKADAI, MADURAI DISTRICT – 625 107 • U-DISE CODE: 33240801294
  </text>

  <!-- Divider -->
  <line x1="80" y1="212" x2="720" y2="212" stroke="#1e3a8a" stroke-width="1.5"/>
  <rect x="200" y="222" width="400" height="34" rx="6" fill="#1e3a8a"/>
  <text x="400" y="244" font-family="'Arial', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    BONAFIDE STUDY CERTIFICATE (6th TO 12th STD)
  </text>
  <text x="400" y="274" class="tamil" font-size="13" fill="#1e3a8a">அரசுப் பள்ளி பயின்றதற்கான சான்றிதழ் (6 முதல் 12-ஆம் வகுப்பு வரை)</text>
  <line x1="80" y1="284" x2="720" y2="284" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Ref details -->
  <g transform="translate(80, 305)">
    <rect width="640" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="20" class="label">Certificate Ref No:</text>
    <text x="18" y="38" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#1e3a8a">GGHSS-MDU-BONAFIDE-2024-402</text>

    <text x="320" y="20" class="label">EMIS Student ID:</text>
    <text x="320" y="38" class="val">332408012948</text>

    <text x="520" y="20" class="label">Issue Date:</text>
    <text x="520" y="38" class="val">18-May-2024</text>
  </g>

  <!-- Certification Statement -->
  <g transform="translate(80, 385)">
    <text x="0" y="0" class="body-txt">
      <tspan x="0" dy="0">This is to certify that Selvi <tspan font-weight="bold" fill="#0f172a">KAVITHA R (கவிதா ரா)</tspan>, daughter of Thiru <tspan font-weight="bold">RAMASAMY M</tspan>,</tspan>
      <tspan x="0" dy="28">residing at No. 14, Kamarajar Street, Anuppanadi, Madurai - 625009, has continuously studied</tspan>
      <tspan x="0" dy="28">in this recognized Government Institution in the classes and academic years mentioned below:</tspan>
    </text>
  </g>

  <!-- Academic Year Breakdown Table -->
  <g transform="translate(80, 475)">
    <!-- Table Header -->
    <rect x="0" y="0" width="640" height="32" fill="#1e3a8a" rx="4"/>
    <text x="40" y="21" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Class / Std</text>
    <text x="180" y="21" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Academic Year</text>
    <text x="360" y="21" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Institution Category</text>
    <text x="540" y="21" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Medium of Instruction</text>

    <!-- Table Rows -->
    <g font-family="'Arial', sans-serif" font-size="12" fill="#1e293b">
      <!-- 6th -->
      <rect x="0" y="32" width="640" height="26" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="40" y="50" text-anchor="middle" font-weight="bold">6th Std</text>
      <text x="180" y="50" text-anchor="middle">2018 - 2019</text>
      <text x="360" y="50" text-anchor="middle" fill="#047857" font-weight="bold">Government School (அரசுப் பள்ளி)</text>
      <text x="540" y="50" text-anchor="middle">Tamil Medium</text>

      <!-- 7th -->
      <rect x="0" y="58" width="640" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="40" y="76" text-anchor="middle" font-weight="bold">7th Std</text>
      <text x="180" y="76" text-anchor="middle">2019 - 2020</text>
      <text x="360" y="76" text-anchor="middle" fill="#047857" font-weight="bold">Government School (அரசுப் பள்ளி)</text>
      <text x="540" y="76" text-anchor="middle">Tamil Medium</text>

      <!-- 8th -->
      <rect x="0" y="84" width="640" height="26" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="40" y="102" text-anchor="middle" font-weight="bold">8th Std</text>
      <text x="180" y="102" text-anchor="middle">2020 - 2021</text>
      <text x="360" y="102" text-anchor="middle" fill="#047857" font-weight="bold">Government School (அரசுப் பள்ளி)</text>
      <text x="540" y="102" text-anchor="middle">Tamil Medium</text>

      <!-- 9th -->
      <rect x="0" y="110" width="640" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="40" y="128" text-anchor="middle" font-weight="bold">9th Std</text>
      <text x="180" y="128" text-anchor="middle">2021 - 2022</text>
      <text x="360" y="128" text-anchor="middle" fill="#047857" font-weight="bold">Government School (அரசுப் பள்ளி)</text>
      <text x="540" y="128" text-anchor="middle">Tamil Medium</text>

      <!-- 10th -->
      <rect x="0" y="136" width="640" height="26" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="40" y="154" text-anchor="middle" font-weight="bold">10th Std (SSLC)</text>
      <text x="180" y="154" text-anchor="middle">2022 - 2023</text>
      <text x="360" y="154" text-anchor="middle" fill="#047857" font-weight="bold">Government School (அரசுப் பள்ளி)</text>
      <text x="540" y="154" text-anchor="middle">Tamil Medium</text>

      <!-- 11th -->
      <rect x="0" y="162" width="640" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="40" y="180" text-anchor="middle" font-weight="bold">11th Std (HSC)</text>
      <text x="180" y="180" text-anchor="middle">2023 - 2024</text>
      <text x="360" y="180" text-anchor="middle" fill="#047857" font-weight="bold">Government School (அரசுப் பள்ளி)</text>
      <text x="540" y="180" text-anchor="middle">Tamil Medium</text>

      <!-- 12th -->
      <rect x="0" y="188" width="640" height="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
      <text x="40" y="206" text-anchor="middle" font-weight="bold" fill="#1e3a8a">12th Std (+2)</text>
      <text x="180" y="206" text-anchor="middle" font-weight="bold">2023 - 2024</text>
      <text x="360" y="206" text-anchor="middle" fill="#047857" font-weight="bold">Government School (அரசுப் பள்ளி)</text>
      <text x="540" y="206" text-anchor="middle" font-weight="bold">Tamil Medium</text>
    </g>
  </g>

  <!-- Statutory Mandate for Pudhumai Penn -->
  <g transform="translate(80, 715)">
    <rect width="640" height="85" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="16" y="24" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#166534">
      ✔ STATUTORY VERIFICATION FOR MOOVALUR RAMAMIRTHAM AMMAIYAR (PUDHUMAI PENN) SCHEME:
    </text>
    <text x="16" y="44" font-family="'Arial', sans-serif" font-size="11" fill="#14532d">
      It is verified that the above student has completed 6th to 12th standard solely in Tamil Nadu Government School.
    </text>
    <text x="16" y="62" font-family="'Arial', sans-serif" font-size="11" fill="#14532d">
      The student did not study in any private matriculation / aided non-government institution during this period.
    </text>
  </g>

  <!-- Signature & Headmaster Seal -->
  <g transform="translate(80, 835)">
    <!-- School Stamp Seal -->
    <g transform="translate(180, 50)">
      <circle cx="0" cy="0" r="44" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="3,2"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#1e3a8a" stroke-width="1"/>
      <text y="-22" font-family="'Arial', sans-serif" font-size="8" font-weight="bold" fill="#1e3a8a" text-anchor="middle">GGHSS • OTHAKADAI</text>
      <text y="3" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">GOVT OF TN</text>
      <text y="18" font-family="'Arial', sans-serif" font-size="8" fill="#1e3a8a" text-anchor="middle">MADURAI DIST</text>
      <text y="30" font-family="'Arial', sans-serif" font-size="8" font-weight="bold" fill="#2563eb" text-anchor="middle">SEAL</text>
    </g>

    <!-- Headmaster Sign -->
    <g transform="translate(420, 20)">
      <line x1="0" y1="50" x2="200" y2="50" stroke="#0f172a" stroke-width="1"/>
      <text x="100" y="68" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">HEADMASTER / தலைமை ஆசிரியர்</text>
      <text x="100" y="84" font-family="'Arial', sans-serif" font-size="11" fill="#475569" text-anchor="middle">Govt Girls Hr Sec School</text>
      <text x="100" y="98" font-family="'Arial', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Othakadai, Madurai - 625107</text>
    </g>
  </g>

  <!-- Disclaimer Footer -->
  <g transform="translate(80, 1010)">
    <rect width="640" height="50" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="320" y="20" font-family="'Arial', sans-serif" font-size="11" font-weight="900" fill="#991b1b" text-anchor="middle">
      PROTOTYPE MOCK DOCUMENT — FOR TN WELFAREPATH SYSTEM TESTING ONLY
    </text>
    <text x="320" y="38" font-family="'Arial', sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      Not an authentic Government of Tamil Nadu certificate. Generated strictly for verification workspace demonstration.
    </text>
  </g>
</svg>
