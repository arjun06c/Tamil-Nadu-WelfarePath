      .label { font-family: 'Arial', sans-serif; font-size: 11.5px; fill: #475569; font-weight: bold; }
      .val { font-family: 'Courier New', monospace; font-size: 13.5px; fill: #0f172a; font-weight: bold; }
      .watermark { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: 900; fill: rgba(220, 38, 38, 0.14); text-anchor: middle; letter-spacing: 3px; }
