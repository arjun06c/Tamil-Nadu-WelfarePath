<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', serif; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .tamil { font-family: 'Arial Unicode MS', 'Plus Jakarta Sans', sans-serif; font-weight: bold; fill: #1e3a8a; text-anchor: middle; }
      .label { font-family: 'Arial', sans-serif; font-size: 13px; fill: #475569; font-weight: bold; }
      .val { font-family: 'Arial', sans-serif; font-size: 14px; fill: #0f172a; font-weight: bold; }
      .watermark { font-family: 'Arial', sans-serif; font-size: 26px; font-weight: 900; fill: rgba(220, 38, 38, 0.13); text-anchor: middle; letter-spacing: 4px; }
      .cert-body { font-family: 'Georgia', serif; font-size: 15px; fill: #1e293b; line-height: 1.8; }
    </style>
  </defs>

  <rect width="800" height="1130" fill="#fffdfa"/>
  <rect x="25" y="25" width="750" height="1080" fill="none" stroke="#047857" stroke-width="3"/>
  <rect x="32" y="32" width="736" height="1066" fill="none" stroke="#10b981" stroke-width="1.2"/>
  <rect x="36" y="36" width="728" height="1058" fill="none" stroke="#047857" stroke-width="0.6"/>

  <!-- Watermark -->
  <g transform="translate(400, 560) rotate(-40)">
    <text y="-180" class="watermark">★ MOCK CITIZEN DOCUMENT ★</text>
    <text y="-140" class="watermark">PROTOTYPE DEMONSTRATION ONLY</text>
    <text y="0" class="watermark" font-size="34" fill="rgba(220, 38, 38, 0.16)">NOT VALID FOR OFFICIAL USE</text>
    <text y="140" class="watermark">TN WELFAREPATH VERIFICATION WORKSPACE</text>
    <text y="180" class="watermark">★ FOR AUDIT SIMULATION ONLY ★</text>
  </g>

  <!-- Emblem -->
  <g transform="translate(400, 80)">
    <circle cx="0" cy="0" r="32" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <path d="M -16 16 L 16 16 L 12 -4 L 8 -16 L 0 -22 L -8 -16 L -12 -4 Z" fill="#047857"/>
    <text y="7" font-family="'Times New Roman', serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">TN GOVT</text>
  </g>

  <text x="400" y="135" class="tamil" font-size="19">தமிழ்நாடு அரசு • வருவாய்த் துறை</text>
  <text x="400" y="158" class="title" font-size="18" letter-spacing="1">GOVERNMENT OF TAMIL NADU</text>
  <text x="400" y="178" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">REVENUE DEPARTMENT • MADURAI DISTRICT</text>

  <line x1="80" y1="205" x2="720" y2="205" stroke="#047857" stroke-width="1.5"/>
  <rect x="230" y="215" width="340" height="34" rx="6" fill="#047857"/>
  <text x="400" y="237" font-family="'Arial', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    NATIVITY &amp; RESIDENCE CERTIFICATE
  </text>
  <text x="400" y="265" class="tamil" font-size="13" fill="#047857">இருப்பிட மற்றும் பிறப்பிடச் சான்றிதழ்</text>
  <line x1="80" y1="275" x2="720" y2="275" stroke="#047857" stroke-width="1.5"/>

  <!-- Ref details -->
  <g transform="translate(80, 295)">
    <rect width="640" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="20" class="label">Certificate Ref No:</text>
    <text x="18" y="38" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#047857">TN-NAT-2025-110294</text>

    <text x="320" y="20" class="label">e-District Application No:</text>
    <text x="320" y="38" class="val">TN-MDU-NAT-2025-0819</text>

    <text x="520" y="20" class="label">Issue Date:</text>
    <text x="520" y="38" class="val">19-Sep-2025</text>
  </g>

  <!-- Certification Statement -->
  <g transform="translate(80, 375)">
    <text x="0" y="0" class="cert-body">
      <tspan x="0" dy="0">This is to certify that Selvi <tspan font-weight="bold">KAVITHA R (கவிதா ரா)</tspan>, daughter of Thiru <tspan font-weight="bold">RAMASAMY M</tspan>,</tspan>
      <tspan x="0" dy="28">is a native and permanent bonafide resident of Tamil Nadu, residing continuously at:</tspan>
      <tspan x="0" dy="32" font-weight="bold" fill="#047857">Door No. 14, Kamarajar Street, Anuppanadi Village, Madurai South Taluk,</tspan>
      <tspan x="0" dy="26" font-weight="bold" fill="#047857">Madurai District, Tamil Nadu State, Pin Code: 625009.</tspan>
    </text>
  </g>

  <!-- Details Table -->
  <g transform="translate(80, 500)">
    <rect width="640" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="0" y="0" width="220" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="220" y="0" width="420" height="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="16" y="25" class="label">Native District:</text>
    <text x="236" y="25" class="val">Madurai District (மதுரை மாவட்டம்)</text>

    <rect x="0" y="40" width="220" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="220" y="40" width="420" height="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="16" y="65" class="label">Native State:</text>
    <text x="236" y="65" class="val">Tamil Nadu, India</text>

    <rect x="0" y="80" width="220" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="220" y="80" width="420" height="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="16" y="105" class="label">Duration of Residence:</text>
    <text x="236" y="105" class="val">Continuous residence since birth (21 Years)</text>

    <rect x="0" y="120" width="220" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="220" y="120" width="420" height="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="16" y="145" class="label">Scheme Eligibility:</text>
    <text x="236" y="145" class="val" fill="#047857">Tamil Nadu Domicile Criteria Satisfied (100%)</text>

    <rect x="0" y="160" width="220" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="220" y="160" width="420" height="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="16" y="185" class="label">Enquiring Officer:</text>
    <text x="236" y="185" class="val">Revenue Inspector, Anuppanadi Firka</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(80, 830)">
    <!-- QR -->
    <rect x="0" y="0" width="105" height="105" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="6"/>
    <rect x="10" y="10" width="85" height="85" fill="#047857"/>
    <rect x="22" y="22" width="24" height="24" fill="#ffffff"/>
    <rect x="26" y="26" width="16" height="16" fill="#047857"/>
    <rect x="58" y="22" width="24" height="24" fill="#ffffff"/>
    <rect x="62" y="26" width="16" height="16" fill="#047857"/>
    <rect x="22" y="58" width="24" height="24" fill="#ffffff"/>
    <rect x="26" y="62" width="16" height="16" fill="#047857"/>
    <text x="52" y="122" font-family="'Arial', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">e-District QR</text>

    <!-- Stamp -->
    <g transform="translate(240, 50)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="4,2"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#047857" stroke-width="1"/>
      <text y="-20" font-family="'Arial', sans-serif" font-size="8.5" font-weight="bold" fill="#047857" text-anchor="middle">TAHSILDAR • MADURAI SOUTH</text>
      <text y="3" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#047857" text-anchor="middle">NATIVITY SEAL</text>
      <text y="20" font-family="'Arial', sans-serif" font-size="8" fill="#047857" text-anchor="middle">REVENUE DIVISION</text>
    </g>

    <!-- Sign -->
    <g transform="translate(430, 15)">
      <rect width="210" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="22" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" fill="#047857">✔ Digitally Signed By:</text>
      <text x="12" y="40" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#0f172a">TAHSILDAR (வட்டாட்சியர்)</text>
      <text x="12" y="56" font-family="'Arial', sans-serif" font-size="10" fill="#475569">Madurai South Taluk Office</text>
      <text x="12" y="74" font-family="'Arial', sans-serif" font-size="9" fill="#64748b">Date: 2025.09.19 16:32:05 IST</text>
    </g>
  </g>

  <!-- Disclaimer Footer -->
  <g transform="translate(80, 1010)">
    <rect width="640" height="50" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="320" y="20" font-family="'Arial', sans-serif" font-size="11" font-weight="900" fill="#991b1b" text-anchor="middle">
      PROTOTYPE MOCK DOCUMENT — FOR TN WELFAREPATH SYSTEM TESTING ONLY
    </text>
    <text x="320" y="38" font-family="'Arial', sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      Not an authentic Government of Tamil Nadu certificate. Generated strictly for verification workspace demonstration.
    </text>
  </g>
</svg>
